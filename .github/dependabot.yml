version: 2

updates:
  # ---------- Frontend: Angular / npm ----------
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "19:00"
      timezone: "Europe/Berlin"
    # praktisch unbegrenzt: Dependabot soll alles anlegen, was es findet
    open-pull-requests-limit: 100
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      # Angular-Pakete müssen zusammen aktualisiert werden
      angular:
        patterns:
          - "@angular/*"
          - "angular-eslint"
      # Kleine Updates gebündelt, Majors bleiben einzelne PRs
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # Erst nach einer Woche veröffentlichen, schützt vor kompromittierten Releases
    cooldown:
      default-days: 7

  # ---------- Backend: Python / pip ----------
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "19:00"
      timezone: "Europe/Berlin"
    # praktisch unbegrenzt: Dependabot soll alles anlegen, was es findet
    open-pull-requests-limit: 100
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    cooldown:
      default-days: 7

  # ---------- Docker-Images ----------
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    # praktisch unbegrenzt: Dependabot soll alles anlegen, was es findet
    open-pull-requests-limit: 100
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    cooldown:
      default-days: 14

  - package-ecosystem: "docker"
    directory: "/frontend"
    schedule:
      interval: "monthly"
    # praktisch unbegrenzt: Dependabot soll alles anlegen, was es findet
    open-pull-requests-limit: 100
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    cooldown:
      default-days: 14

  # ---------- GitHub Actions ----------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # praktisch unbegrenzt: Dependabot soll alles anlegen, was es findet
    open-pull-requests-limit: 100
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
