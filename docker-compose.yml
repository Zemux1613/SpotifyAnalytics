services:
  backend:
    build: ./backend
    container_name: spotify-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: spotify-frontend
    ports:
      - "4200:4200"
    depends_on:
      - backend
    restart: unless-stopped
