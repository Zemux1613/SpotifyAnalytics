server {
    listen 4200;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api/... geht an das backend, das /api-präfix wird dabei entfernt
    location /api/ {
        # docker-dns, dadurch muss das backend beim start von nginx noch nicht laufen
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # gehashte build-dateien ändern sich nie, die dürfen ewig gecacht werden
    location ~ ^/(?:main|chunk|polyfills|styles)-[A-Za-z0-9]+\.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # single page app: unbekannte pfade (z.b. /top beim reload) liefern die index.html
    location / {
        try_files $uri /index.html;
    }
}
