@if (auth.user(); as user) {
  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" routerLink="/dashboard">SpotifyAnalytics</a>
      <nav class="nav" aria-label="Hauptnavigation">
        <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a routerLink="/top" routerLinkActive="active">Top-Listen</a>
        <a routerLink="/search" routerLinkActive="active">Song suchen</a>
        <a routerLink="/playlists" routerLinkActive="active">Playlists</a>
      </nav>
      <div class="user">
        <button
          type="button"
          class="btn btn--ghost"
          (click)="themeService.toggle()"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Zum Light Mode wechseln' : 'Zum Dark Mode wechseln'"
          [title]="themeService.theme() === 'dark' ? 'Light Mode aktivieren' : 'Dark Mode aktivieren'"
        >
          @if (themeService.theme() === 'dark') {
            <span aria-hidden="true">☀️</span>
          } @else {
            <span aria-hidden="true">🌙</span>
          }
        </button>

        @if (avatar(); as src) {
          <img class="user__avatar" [src]="src" alt="" width="32" height="32">
        }
        <span class="user__name">{{ user.display_name ?? user.id }}</span>
        <button type="button" class="btn btn--ghost" (click)="auth.logout()">Abmelden</button>
      </div>
    </div>
  </header>
}
<main
  [class.main--inspector]="auth.user() && inspector.isOpen()"
  [class.main--now-playing]="auth.user() && inspector.current()"
>
  <router-outlet />
</main>

@if (auth.user()) {
  <app-inspector />
  <app-now-playing />
}
